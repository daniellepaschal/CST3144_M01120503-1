<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After School Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1>{{ sitename }}</h1>
    <p>Items in cart: {{ cart.length }}</p>

    <div class="row g-2 mb-4">
      <div class="col-sm-6">
        <label class="form-label" for="sortBy">Sort by</label>
        <select id="sortBy" class="form-select" v-model="sortBy">
          <option value="topic">Subject</option>
          <option value="location">Location</option>
          <option value="price">Price</option>
          <option value="space">Spaces</option>
        </select>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="sortOrder">Order</label>
        <select id="sortOrder" class="form-select" v-model="sortOrder">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm-6 col-lg-4" v-for="lesson in sortedLessons" :key="lesson._id">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">
              <i :class="['fa', lesson.icon]" aria-hidden="true"></i> {{ lesson.topic }}
            </h2>
            <p class="mb-1">Location: {{ lesson.location }}</p>
            <p class="mb-1">Price: Rs {{ lesson.price }}</p>
            <p class="mb-0" :class="{ 'text-danger': remaining(lesson) === 0 }">
              <span v-if="remaining(lesson) > 0">{{ remaining(lesson) }} space(s) left</span>
              <span v-else>Fully booked</span>
            </p>
          </div>
          <div class="card-footer bg-transparent border-0 pb-3">
            <button class="btn btn-primary w-100" @click="addToCart(lesson)" :disabled="remaining(lesson) <= 0">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
