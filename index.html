<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After School Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="container py-4">
    <h1>{{ sitename }}</h1>

    <div class="row g-3">
      <div class="col-sm-6 col-lg-4" v-for="lesson in lessons" :key="lesson._id">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">
              <i :class="['fa', lesson.icon]" aria-hidden="true"></i> {{ lesson.topic }}
            </h2>
            <p class="mb-1">Location: {{ lesson.location }}</p>
            <p class="mb-1">Price: Rs {{ lesson.price }}</p>
            <p class="mb-0">{{ lesson.space }} space(s) left</p>
          </div>
        </div>
      </div>
    </div>
  </div>{{sitename }}</h1>
  </div>
  <script src="app.js"></script>
</body>
</html>
